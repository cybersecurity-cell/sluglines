name: secret-scan

# Scans the working tree and full commit history for committed credentials.
# Runs on the whole history (fetch-depth: 0) because a secret removed in a later
# commit is still disclosed by the commit that introduced it.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret is disclosed by the commit that introduced it,
          # not only by the tip of the branch.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  tracked-env-files:
    name: no tracked .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fail if any .env file is tracked
        run: |
          # .gitignore covers .env* today, but a `git add -f` would bypass it.
          # This is a cheap, deterministic backstop alongside the scanner above.
          tracked="$(git ls-files -- '.env' '.env.*' ':!.env.example' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked environment files found:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."
