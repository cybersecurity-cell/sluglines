name: e2e

# Browser-level tests for the public surface — issue #35.
#
# DELIBERATELY ITS OWN WORKFLOW, not a job inside ci.yml.
#
# #35's last bullet: "kept separate from the `test` job so a browser flake does
# not block a merge on a SQL change". A browser suite has a different failure
# profile from `npm test` — it builds the app, boots a server and drives Chromium
# — and folding it in would mean a migration-only PR waits on a browser and can be
# blocked by it. Separate workflows also mean the required-checks list can include
# one and not the other, which is the control that makes the split real rather
# than cosmetic.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Public surface (Chromium)
    runs-on: ubuntu-latest
    # The suite builds the app before it can serve it, so the default 6h is far
    # too generous for something that should take ~2 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts above means Playwright's postinstall never ran, so the
      # browser is fetched explicitly. Only Chromium: the suite declares desktop
      # and mobile Chromium projects and nothing else, and downloading Firefox and
      # WebKit to leave them unused is a minute of CI per run for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No Supabase credentials here, deliberately. The public pages are designed
      # to render signed-out against a database they cannot reach — that is the
      # D-33 `unavailable` path — and the specs assert what a signed-out visitor
      # sees. Credentials would test a different page than the one under review.
      - name: Run browser tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
