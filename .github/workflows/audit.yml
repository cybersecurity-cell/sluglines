name: audit

# Dependency vulnerability gate. Fails on any high/critical advisory that is not
# covered by a dated entry in .github/audit-exceptions.json. An expired entry
# also fails the job, so an accepted risk cannot quietly become permanent.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories against unchanged dependencies still
    # surface, and so expiring exceptions fail loudly rather than at the next push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (high/critical, with documented exceptions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run audit gate
        run: node scripts/audit-check.mjs --level=high

      - name: Report exception status
        if: always()
        run: |
          echo "Exceptions are declared in .github/audit-exceptions.json."
          echo "Each entry requires: advisory or package scope, reason, approvedBy, expires."
