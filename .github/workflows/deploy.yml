name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/vercel pull --yes --environment=${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - run: ./node_modules/.bin/vercel build ${{ github.event.workflow_run.head_branch == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy tested artifact
        id: deployment
        run: |
          deployment_url=$(./node_modules/.bin/vercel deploy --prebuilt ${{ github.event.workflow_run.head_branch == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Assign staging domain
        if: github.event.workflow_run.head_branch == 'staging'
        run: ./node_modules/.bin/vercel alias set "${{ steps.deployment.outputs.url }}" staging.sluglines.com --token=${{ secrets.VERCEL_TOKEN }}
